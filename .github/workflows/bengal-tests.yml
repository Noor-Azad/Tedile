name: Bengal Learning Center Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "BengalLearningCenter/**"
      - ".github/workflows/bengal-tests.yml"
  push:
    branches:
      - main
    paths:
      - "BengalLearningCenter/**"
      - ".github/workflows/bengal-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./BengalLearningCenter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q
