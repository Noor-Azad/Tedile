name: Tedile Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "Tedile/**"
      - ".github/workflows/tedile-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Tedile/**"
      - ".github/workflows/tedile-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Tedile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: testing
          TESTING: "true"
        run: |
          python -m pytest -q
