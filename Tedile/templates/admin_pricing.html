<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Tedile | Fare pricing</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" /></head><body><header class="topbar"><h1>Tedile</h1><div class="topbar-user"><span>{{ user.name }} · {{ user.role }}</span><a href="{{ url_for('admin.admin_dashboard') }}">Admin dashboard</a></div></header><main class="dashboard"><section class="card"><h2>Current fare pricing</h2><p>Version: {{ configuration.pricing_version }}</p><p>Base fare: {{ configuration.currency }} {{ '%.2f'|format(configuration.base_fare) }}</p>{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label>Base fare<input type="number" name="base_fare" value="{{ '%.2f'|format(configuration.base_fare) }}" min="0.01" step="0.01" required /></label><label>Currency<input type="text" name="currency" value="{{ configuration.currency }}" maxlength="3" required /></label><button type="submit">Save new pricing version</button></form></section></main></body></html>
