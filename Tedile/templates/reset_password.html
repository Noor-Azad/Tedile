<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tedile | New Password</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="marketplace-page"><header class="site-header"><a class="wordmark" href="{{ url_for('auth.login_page') }}">Tedile</a></header><main><section class="auth-panel"><div class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Set a new password.</h1></div>{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form class="form-card" method="POST" action="{{ url_for('auth.reset_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="8" required></label><label>Confirm password<input type="password" name="password_confirmation" minlength="8" required></label><button class="button button-primary" type="submit">Reset password</button></form></section></main></body></html>
