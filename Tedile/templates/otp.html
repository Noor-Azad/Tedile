<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tedile | Verify</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="marketplace-page"><header class="site-header"><a class="wordmark" href="{{ url_for('auth.login_page') }}">Tedile</a></header><main><section class="auth-panel"><div class="auth-intro"><p class="eyebrow">SECURITY CHECK</p><h1>Verify your account.</h1><p>Enter the verification code sent through the configured delivery channel.</p></div>{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form class="form-card" method="POST" action="{{ url_for('auth.verify_otp') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Verification code<input name="otp" inputmode="numeric" autocomplete="one-time-code" required></label><button class="button button-primary" type="submit">Verify</button></form><form class="form-card" method="POST" action="{{ url_for('auth.resend_otp') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button button-secondary" type="submit">Resend code</button></form></section></main></body></html>
