<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tedile | Welcome</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body class="marketplace-page"><header class="site-header"><a class="wordmark" href="{{ url_for('auth.login_page') }}">Tedile</a></header><main><section class="auth-panel" id="login-panel"><div class="auth-intro"><p class="eyebrow">WELCOME TO TEDILE</p><h1>Local help, made simple.</h1><p>Log in or create an account to continue.</p></div>{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}{% if message %}<p class="success-banner">{{ message }}</p>{% endif %}<div class="auth-grid"><form class="form-card" method="POST" action="{{ url_for('auth.login') }}"><h2>Log in</h2><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="button button-primary" type="submit">Continue</button><a href="{{ url_for('auth.forgot_password_page') }}">Forgot Password?</a></form><form class="form-card" method="POST" action="{{ url_for('auth.signup') }}"><h2>Register</h2><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label><label>Mobile number<input type="tel" name="phone"></label><label>Password<input type="password" name="password" minlength="8" required></label><input type="hidden" name="role" value="customer"><button class="button button-secondary" type="submit">Create account</button></form></div></section></main></body></html>
