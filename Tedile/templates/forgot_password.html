<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tedile | Forgot Password</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="marketplace-page"><header class="site-header"><a class="wordmark" href="{{ url_for('auth.login_page') }}">Tedile</a></header><main><section class="auth-panel"><div class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Forgot Password?</h1><p>Enter your mobile number to request a verification code.</p></div>{% if message %}<p class="success-banner">{{ message }}</p>{% endif %}{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form class="form-card" method="POST" action="{{ url_for('auth.request_password_reset') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Mobile number<input type="tel" name="phone" required></label><button class="button button-primary" type="submit">Continue</button></form><a class="button button-secondary" href="{{ url_for('auth.login') }}">Back to Login</a></section></main></body></html>
